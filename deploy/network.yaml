# Namespace-local application communication; database/broker/Redis are never Ingress backends.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: eob-ingress, namespace: eob}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: eob-public-entry, namespace: eob}
spec:
  podSelector: {matchExpressions: [{key: app, operator: In, values: [api-gateway, desktop-gateway, frontend]}]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: TCP, port: 8080}]
# External compute nodes need a separately restricted private route to desktop-gateway /internal/job-events.
# Do not route /internal through the public Ingress or grant Node Runtime host privileges to business Pods.
