apiVersion: v1
kind: Service
metadata: {name: nats, namespace: eob}
spec:
  selector: {app: nats}
  ports: [{name: client, port: 4222, targetPort: 4222}, {name: monitor, port: 8222, targetPort: 8222}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: nats, namespace: eob}
spec:
  serviceName: nats
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector: {matchLabels: {app: nats}}
  template:
    metadata: {labels: {app: nats}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: nats
          image: nats:2.11-alpine
          args: [-c, /etc/nats/nats.conf]
          env:
            - {name: NATS_USER, value: eob}
            - name: NATS_PASSWORD
              valueFrom: {secretKeyRef: {name: eob-infra-secret, key: NATS_PASSWORD}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          ports: [{containerPort: 4222}, {containerPort: 8222}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          startupProbe: {httpGet: {path: /healthz, port: 8222}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /healthz, port: 8222}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8222}, periodSeconds: 15}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/nats, readOnly: true}
      volumes:
        - name: config
          configMap: {name: eob-nats-config}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: eob-local-retain, resources: {requests: {storage: 5Gi}}}
