apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: eob}
spec:
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: eob}
spec:
  serviceName: postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17-alpine
          args: [postgres, -c, config_file=/etc/postgresql/postgres.conf]
          env:
            - {name: POSTGRES_DB, value: eob}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: eob-infra-secret, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: '2', memory: 1Gi}}
          startupProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, eob]}, periodSeconds: 2, failureThreshold: 60}
          readinessProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, eob]}, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, eob]}, periodSeconds: 15}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: config, mountPath: /etc/postgresql, readOnly: true}
      volumes:
        - name: config
          configMap: {name: eob-postgres-config}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: eob-local-retain, resources: {requests: {storage: 20Gi}}}
