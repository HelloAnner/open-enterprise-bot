# Optional PRIVATE Node Runtime callback route. Set cidr to your actual compute-host subnet before applying.
apiVersion: v1
kind: Service
metadata: {name: desktop-node-callback, namespace: eob}
spec:
  type: NodePort
  selector: {app: desktop-gateway}
  ports: [{name: private-http, port: 8080, targetPort: 8080, nodePort: 30083}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: compute-host-callback, namespace: eob}
spec:
  podSelector: {matchLabels: {app: desktop-gateway}}
  policyTypes: [Ingress]
  ingress:
    - from: [{ipBlock: {cidr: 10.0.0.0/24}}] # Replace; never use 0.0.0.0/0 here.
      ports: [{protocol: TCP, port: 8080}]
