apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: eob
resources:
  - namespace.yaml
  - configmaps.yaml
  - infra/storageclass.yaml
  - infra/postgres.yaml
  - infra/nats.yaml
  - infra/redis.yaml
  - apps/backends.yaml
  - apps/frontend.yaml
  - network.yaml
patches:
  - target: {kind: Deployment, labelSelector: tier=backend}
    patch: |-
      - op: add
        path: /spec/strategy
        value: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /spec/template/spec/terminationGracePeriodSeconds
        value: 75
      - op: add
        path: /spec/template/spec/securityContext
        value: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '2', memory: 512Mi}}
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 2, failureThreshold: 60}
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 5}
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 15}
# Use images/replacements in your environment overlay to pin registry paths and immutable release tags/digests.
