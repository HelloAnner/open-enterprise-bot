  <text x="237" y="148" font-family="Arial,'PingFang SC',sans-serif" font-size="10" fill="#53646b">你好，我们看到了你的简历</text><text x="237" y="165" font-family="Arial,'PingFang SC',sans-serif" font-size="10" fill="#53646b">想和你进一步聊聊这个岗位。</text>
